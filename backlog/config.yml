project_name: "noon"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: ["config", "schedule", "runner", "store", "scheduler", "cli", "integration", "mcp", "http", "ops", "tui", "security"]
definition_of_done: ["task ci passes on the final commit", "Every checked acceptance criterion has an AC#N evidence line in Implementation Notes naming the command and its result", "The diff stays within the modified-file contract, or Implementation Notes justify each deviation", "No test was deleted, skipped, or weakened", "README, docs, and command help describe only implemented behavior; docs/design.md matches any contract the task settled"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "vi"
auto_open_browser: false
default_port: 6420
remote_operations: false
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "NOON"
