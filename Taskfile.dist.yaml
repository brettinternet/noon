version: "3"

includes:
  setup: .taskfiles/setup.yaml
  cli: .taskfiles/cli.yaml
  release: .taskfiles/release.yaml

tasks:
  default:
    silent: true
    cmd: task -l
  init:
    desc: Install pinned tools, Go modules, and Git hooks
    aliases: [setup]
    cmds:
      - task: setup:init
      - task: cli:init
  check:staged:
    desc: Format staged Go and scan the staged snapshot for secrets
    cmd: mise exec lefthook -- lefthook run pre-commit
  fix:staged:
    desc: Format and re-stage Go files
    cmd: mise exec lefthook -- lefthook run pre-commit --tag fix
  check:
    desc: Check formatting, Go source, and changelog generation
    cmds:
      - task: cli:check
      - mise exec git-cliff -- git-cliff > /dev/null
  fix:
    desc: Format Go source
    cmd: { task: cli:fix }
  test:
    desc: Run tests
    cmd: { task: cli:test, vars: { PKG: ./... } }
  race:
    desc: Run tests with the race detector
    cmd: mise exec go -- go test -race ./...
  security:
    desc: Scan Git history and reachable Go vulnerabilities
    cmds:
      - mise exec gitleaks -- gitleaks git --redact --verbose --no-banner
      - mise exec go:golang.org/x/vuln/cmd/govulncheck -- govulncheck ./...
  smoke:
    desc: Exercise the built binary in an isolated environment
    cmds:
      - task: cli:build
      - sh scripts/smoke.sh
  release:smoke:
    desc: Verify isolated no-argument behavior of the native Noon binary
    deps: [cli:build]
    vars:
      BINARY: '{{.BINARY | default "bin/noon"}}'
      VERSION: '{{.VERSION | default ""}}'
    env:
      BINARY: "{{.BINARY}}"
      VERSION: "{{.VERSION}}"
    cmd: sh scripts/release-smoke.sh
  shell:smoke:
    desc: Verify generated integration in real Bash, Zsh, and Fish (all required on PATH)
    cmds:
      - task: cli:build
      - mise exec go -- go test -tags shellintegration -run '^TestShellSmoke$' -count=1 -v ./integration
  examples:docker-agent:
    desc: Opt-in credential-free Docker agent execution and persistence checks
    cmds:
      - task: docker:build
      - docker build -t noon-agent:local examples/integrations/docker-agent
      - bash scripts/docker-agent-smoke.sh
  examples:db-backups:
    desc: Opt-in real PostgreSQL/SQLite backup checks with host clients and Docker
    cmds:
      - task: cli:build
      - bash scripts/db-backups-smoke.sh host
  examples:db-backups:linux:
    desc: Opt-in real backup checks with Debian clients and Docker
    cmd: bash scripts/db-backups-smoke.sh linux
  ci:
    desc: Full local and CI gate
    cmds:
      - task: security
      - task: check
      - task: test
      - task: race
      - task: smoke
  changelog:
    desc: Generate changelog from conventional commits
    cmd: mise exec git-cliff -- git-cliff --output CHANGELOG.md
  backlog:
    desc: List ready, unclaimed work in delivery order
    cmd: mise exec -- backlog task list --ready --status "To Do" --sort ordinal --plain
  backlog:next:
    desc: Show the next ready, unclaimed task
    cmd: mise exec -- backlog task list --ready --status "To Do" --sort ordinal --limit 1 --plain
  docker:build:
    desc: Build the local noon development image
    cmd: docker build -t noon:dev .
  docker:integration:
    desc: Verify production scheduling, signals, and persistence on a Linux Docker engine
    cmds:
      - task: docker:build
      - mise exec go -- go test -tags dockerintegration -count=1 -v -timeout=5m ./scripts/dockerintegration
  docker:smoke:
    desc: Check the container bootstrap without running jobs
    cmds:
      - task: docker:build
      - docker run --rm noon:dev --version
      - docker run --rm --read-only noon:dev --json config check
