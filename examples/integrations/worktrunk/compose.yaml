# One database per worktree. scripts/worktree.sh sets COMPOSE_PROJECT_NAME from the checkout path,
# so each worktree gets its own container, volume, and free loopback port.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1::5432"
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  data:
