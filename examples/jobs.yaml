version: 1
timezone: America/Chicago
vars_file: .noon.vars # Optional, local config-time values; see basics/env-files.

jobs:
  tests:
    description: >
      Run the full Go test suite on weekdays or after Go code changes.
      Before reporting verification complete, wait for success and inspect failures.
    schedule: ${TESTS_SCHEDULE:-weekdays at 9am}
    until: 2099-01-01 00:00 # Stop unattended starts at this project-local time.
    splay: 10m
    jitter: 5m
    run: [go, test, ./...]
    cwd: .
    env_file: .env # Create this gitignored file before running; config check does not read it.
    env:
      GOFLAGS: "-count=1"
    timeout: 10m
    overlap: skip
    requests: merge
    missed: run_once
    enabled: true
    os: [linux, darwin]
    arch: [amd64, arm64]
  report:
    description: Report changed files; a clean working tree means no work to report.
    run: "if [ -z \"$(git status --porcelain)\" ]; then echo 'working tree clean'; exit 78; fi; git status --short"
    noop_exit_code: 78
    timeout: none
  reminder:
    description: Disabled interval example
    schedule: every 6h
    run: "printf 'Take a break\n'"
    overlap: queue
    missed: skip
    enabled: false
  review:
    description: Review pull requests
    prompt: Review open pull requests and list the main risks.
    agent: claude
