version: 1
timezone: America/Chicago

jobs:
  tests:
    description: >
      Run the full Go test suite on weekdays or after Go code changes.
      Before reporting verification complete, wait for success and inspect failures.
    schedule: weekdays at 9am
    run: [go, test, ./...]
    cwd: .
    env:
      GOFLAGS: "-count=1"
    timeout: 10m
    overlap: skip
    requests: merge
    missed: run_once
    enabled: true
    os: [linux, darwin]
    arch: [amd64, arm64]
  report:
    description: Manual report using a shell string
    run: "git log -5 --oneline"
    timeout: none
  reminder:
    description: Disabled interval example
    schedule: every 6h
    run: "printf 'Take a break\n'"
    overlap: queue
    missed: skip
    enabled: false
  review:
    description: Review pull requests
    prompt: Review open pull requests and list the main risks.
    agent: claude
