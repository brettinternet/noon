# ~/.config/noon/config.yaml — agent profiles live here because they name binaries
# and permissions on *this* machine. Project noon.yaml can only refer to them by name.
default_agent: claude

agents:
  # Manual-mode Claude: unanswered prompts are denied, but settings/hooks may allow more.
  # This is NOT a read-only sandbox. Read/Grep/Glob need no approval within working dirs.
  claude-manual:
    command: [claude, -p, --permission-prompts, none, --permission-mode, manual]

  # Claude that may edit files in the job's cwd. Still never waits for a prompt.
  claude-edit:
    command: [claude, -p, --permission-prompts, none, --permission-mode, acceptEdits]

  # Manual-mode Claude plus pre-approved Git commands; rules are not a sandbox.
  claude-git:
    command:
      - claude
      - -p
      - --permission-prompts
      - none
      - --permission-mode
      - manual
      - --allowedTools
      - Bash(git log *)
      - Bash(git describe *)
      - Bash(git diff *)

  # Codex in its read-only and workspace-write sandboxes; "-" reads the prompt from stdin.
  codex-read:
    command: [codex, exec, --sandbox, read-only, "-"]
  codex-edit:
    command: [codex, exec, --sandbox, workspace-write, "-"]

  # Gemini, OpenCode, and Pi already have built-in profiles; no entries are needed here.

  # A local model; no tools, so give it everything it needs in the prompt.
  ollama:
    command: [ollama, run, llama3.2]
    prompt: stdin
