# GitHub webhooks trigger AI review of pull requests and triage of new issues.
# The scheduler must have the secret in its environment and run with --listen.
version: 1

jobs:
  pr-review:
    description: Review open pull requests whose latest commit has not been reviewed. Woken by webhooks.
    run: [./scripts/pr-review.sh]
    webhook:
      secret_env: NOON_GITHUB_WEBHOOK_SECRET
    env:
      AGENT_CMD: claude -p --permission-prompts none
      REVIEW_DIR: .noon-reviews
      MAX_REVIEWS: "3"         # per run; the rest are picked up by the next run
      POST_COMMENT: "0"        # "1" posts each review as a PR comment
    timeout: 30m

  issue-triage:
    description: Suggest labels and a first response for untriaged open issues. Woken by webhooks.
    run: [./scripts/issue-triage.sh]
    webhook:
      secret_env: NOON_GITHUB_WEBHOOK_SECRET
    env:
      AGENT_CMD: claude -p --permission-prompts none
      TRIAGE_DIR: .noon-issue-triage
      APPLY_LABELS: "0"        # "1" applies the suggested labels
    timeout: 15m
