# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
# When a job fails, queue an agent to read its log and explain why.
version: 1

jobs:
  test:
    description: Nightly test suite. Failures are triaged automatically.
    schedule: every day at 2am
    run: [make, test]
    timeout: 30m
    on_failure: [noon, run, triage, --detach]

  e2e:
    description: Nightly browser tests. Failures are triaged automatically.
    schedule: every day at 3am
    run: [make, e2e]
    timeout: 45m
    on_failure: [noon, run, triage, --detach]

  triage:
    description: Diagnose recent failed runs in this project that have no report yet. Queued by on_failure hooks.
    run: [./scripts/triage.sh]
    noop_exit_code: 78
    env:
      AGENT_CMD: claude -p --permission-prompts none
      TRIAGE_DIR: .noon-triage
      SINCE_HOURS: "48"        # ignore older failures
      MAX_TRIAGE: "3"          # per run; the rest are picked up by the next run
    timeout: 15m
    on_success: [./scripts/notify.sh]
