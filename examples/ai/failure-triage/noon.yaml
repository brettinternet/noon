# When a job fails, queue an agent to read its log and explain why.
version: 1

jobs:
  test:
    description: Nightly test suite. Failures are triaged automatically.
    schedule: every day at 2am
    run: [make, test]
    timeout: 30m
    # The hook's stdin is the failed run's JSON; --data - stores it as triage's event file.
    on_failure: [noon, run, triage, --detach, --data, "-"]

  e2e:
    description: Nightly browser tests. Failures are triaged automatically.
    schedule: every day at 3am
    run: [make, e2e]
    timeout: 45m
    on_failure: [noon, run, triage, --detach, --data, "-"]

  triage:
    description: Diagnose a failed run from its log. Queued by on_failure hooks; reads NOON_EVENT_FILE.
    run: [./scripts/triage.sh]
    env:
      AGENT_CMD: claude -p --permission-prompts none
      TRIAGE_DIR: .noon-triage
    timeout: 10m
    overlap: queue          # two failures overnight: triage both, one after the other
    on_success: [./scripts/notify.sh]
