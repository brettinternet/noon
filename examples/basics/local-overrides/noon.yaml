# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
# Shared, committed jobs. Everyone who clones the repo sees these.
version: 1

jobs:
  test:
    description: Full test suite each weekday morning.
    schedule: weekdays at 9am
    run: [make, test]
    timeout: 20m
  lint:
    description: Lint every two hours on weekdays.
    schedule: "0 */2 * * 1-5"
    run: [make, lint]
  docs:
    description: Rebuild the docs site preview.
    run: [make, docs]

  mac-info:
    description: Manual macOS-only inspection; Linux users see other platform.
    os: [darwin]
    run: [uname, -s]
  linux-info:
    description: Manual Linux-only inspection; macOS users see other platform.
    os: [linux]
    run: [uname, -s]
  arm-info:
    description: Manual inspection for an arm64 Noon binary on either supported OS.
    arch: [arm64]
    run: [uname, -m]
