# yaml-language-server: $schema=https://raw.githubusercontent.com/brettinternet/noon/main/noon.schema.json
# Run a check-in when you cd into the project. Pairs with: noon shell init <shell> --on-enter check-in
version: 1

jobs:
  check-in:
    description: >
      On project entry: fetch, then fail if the branch is behind its upstream or mise tools
      requested by the project are not installed, so an on_failure hook can tell you.
    run: [./scripts/check-in.sh]
    timeout: 2m
    cooldown: 15m       # hopping between terminals should not refetch every time
    on_failure: [./scripts/notify.sh]
