version: "3"

tasks:
  init:
    cmd: mise exec go -- go mod download
  build:
    desc: Build bin/noon
    cmds:
      - mkdir -p bin
      - mise exec go -- go build -o bin/noon ./cmd/noon
  run:
    desc: Run noon from source
    cmd: mise exec go -- go run ./cmd/noon {{.CLI_ARGS}}
  fix:
    cmd: find cmd internal -type f -name '*.go' -exec mise exec go -- gofmt -w {} +
  check:
    desc: Check all Go formatting, vet, and Staticcheck
    cmds:
      - test -z "$(find cmd internal -type f -name '*.go' -exec mise exec go -- gofmt -l {} +)"
      - mise exec go -- go vet ./...
      - mise exec staticcheck -- staticcheck ./...
  test:
    desc: Run Go tests (PKG selects packages; defaults to ./...)
    vars:
      PKG: '{{.PKG | default "./..."}}'
    cmd: mise exec go -- go test {{.PKG}} {{.CLI_ARGS}}
